<div class="app-layout">
  <aside class="sidebar">
    <a class="brand" routerLink="/emp-list" aria-label="EmployeeHub home">
      <span class="brand-mark">E</span>
      <span>People<span class="brand-light">Flow</span></span>
    </a>

    <div class="nav-section-label">WORKSPACE</div>
    <nav class="side-nav" aria-label="Main navigation">
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/>
        </svg>
        <span>Dashboard</span>
      </a>
      <a routerLink="/emp-list" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M10 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM20 8v6m3-3h-6" />
        </svg>
        <span>Employees</span>
      </a>
      <a routerLink="/leaves" routerLinkActive="active">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <span>Leaves & Attendance</span>
      </a>
      <a routerLink="/emp-form" routerLinkActive="active">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5v14m-7-7h14" />
        </svg>
        <span>Add employee</span>
      </a>
      <a routerLink="/master" routerLinkActive="active">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm0-6v2m0 16v2m10-10h-2M4 12H2m17.07-7.07-1.42 1.42M6.35 17.65l-1.42 1.42m14.14 0-1.42-1.42M6.35 6.35 4.93 4.93" />
        </svg>
        <span>Master</span>
      </a>
    </nav>

    <div class="sidebar-bottom">
      <div class="user-card" routerLink="/profile" style="cursor: pointer;" title="View and edit profile">
        <div class="user-avatar">{{ userInitials }}</div>
        <div class="user-details">
          <span class="user-name">{{ loggedUserName }}</span>
          <span class="user-caption">My Profile & Settings →</span>
        </div>
      </div>
      <button class="logout-button" type="button" (click)="logout()">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10 17l5-5-5-5m5 5H3m9-9h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6" />
        </svg>
        <span>Log off</span>
      </button>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div>
        <p class="eyebrow">EMPLOYEE MANAGEMENT</p>
        <h1>Welcome, {{ loggedUserName }}</h1>
      </div>
      <a routerLink="/profile" class="topbar-avatar" title="My Profile" style="text-decoration: none;">
        {{ userInitials }}
      </a>
    </header>
    <section class="page-content">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
